name: Update VS Marketplace Badges

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    paths:
      - ".github/scripts/update-vsmarketplace-badges*.cjs"
      - ".github/workflows/update-vsmarketplace-badge.yml"
  push:
    paths:
      - ".github/scripts/update-vsmarketplace-badges*.cjs"
      - ".github/workflows/update-vsmarketplace-badge.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test badge generation and failure handling
        run: node --test .github/scripts/update-vsmarketplace-badges.test.cjs

  update-badges:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch install counts and update badges
        run: node .github/scripts/update-vsmarketplace-badges.cjs
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update VS Marketplace install badges"
          file_pattern: badges/vscode-installs.json badges/vscode-installs.svg badges/bloodloss-installs.json badges/bloodloss-installs.svg
